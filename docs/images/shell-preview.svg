<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192334"/>
      <stop offset="100%" stop-color="#121a28"/>
    </linearGradient>

    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    text {
      font-family: 'Consolas', 'Courier New', 'DejaVu Sans Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Terminal Window Background with Shadow -->
  <rect x="20" y="20" width="1060" height="700" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" filter="url(#win-shadow)" />

  <!-- Window Header / Title Bar -->
  <path d="M 20 34 Q 20 20 34 20 L 1066 20 Q 1080 20 1080 34 L 1080 58 L 20 58 Z" fill="url(#header-grad)" />
  <line x1="20" y1="58" x2="1080" y2="58" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Window Control Dots -->
  <circle cx="46" cy="39" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="68" cy="39" r="6.5" fill="#ffbd2e" stroke="#dea125" stroke-width="0.5" />
  <circle cx="90" cy="39" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="550" y="44" fill="#94a3b8" font-size="12.5px" font-weight="500" text-anchor="middle">PebbleLSM — Interactive REPL Shell (java -jar pebble-lsm.jar shell)</text>

  <!-- Terminal Body Content -->
  <text x="35" y="90"><tspan fill="#00f5ff" font-weight="bold">================================================================================</tspan></text>
<text x="35" y="114"><tspan fill="#00f5ff" font-weight="bold"> PebbleLSM Interactive Shell (v1.0.0)</tspan></text>
<text x="35" y="138"><tspan fill="#94a3b8" font-weight="normal"> Connected to: ./data/production-db</tspan></text>
<text x="35" y="162"><tspan fill="#64748b" font-weight="normal"> Type &apos;help&apos; for command list or &apos;exit&apos; to quit.</tspan></text>
<text x="35" y="186"><tspan fill="#00f5ff" font-weight="bold">================================================================================</tspan></text>
<text x="35" y="234"><tspan fill="#38bdf8" font-weight="bold">pebble&gt; </tspan><tspan fill="#f8fafc" font-weight="normal">put user:1001 &apos;{&quot;name&quot;:&quot;Alex&quot;,&quot;role&quot;:&quot;staff_engineer&quot;,&quot;active&quot;:true}&apos;</tspan></text>
<text x="35" y="258"><tspan fill="#22c55e" font-weight="normal">OK (took 0.14 ms)</tspan></text>
<text x="35" y="306"><tspan fill="#38bdf8" font-weight="bold">pebble&gt; </tspan><tspan fill="#f8fafc" font-weight="normal">put temp:session:9821 &apos;token_auth_xyz77&apos; 60</tspan></text>
<text x="35" y="330"><tspan fill="#22c55e" font-weight="normal">OK (TTL: 60s, took 0.08 ms)</tspan></text>
<text x="35" y="378"><tspan fill="#38bdf8" font-weight="bold">pebble&gt; </tspan><tspan fill="#f8fafc" font-weight="normal">get user:1001</tspan></text>
<text x="35" y="402"><tspan fill="#f1f5f9" font-weight="normal">{&quot;name&quot;:&quot;Alex&quot;,&quot;role&quot;:&quot;staff_engineer&quot;,&quot;active&quot;:true}</tspan></text>
<text x="35" y="450"><tspan fill="#38bdf8" font-weight="bold">pebble&gt; </tspan><tspan fill="#f8fafc" font-weight="normal">scan user: user; 3</tspan></text>
<text x="35" y="474"><tspan fill="#475569" font-weight="normal">+----------------------+------------------------------------------------+</tspan></text>
<text x="35" y="498"><tspan fill="#475569" font-weight="normal">| </tspan><tspan fill="#38bdf8" font-weight="bold">KEY                 </tspan><tspan fill="#475569" font-weight="normal"> | </tspan><tspan fill="#38bdf8" font-weight="bold">VALUE                                          </tspan><tspan fill="#475569" font-weight="normal"> |</tspan></text>
<text x="35" y="522"><tspan fill="#475569" font-weight="normal">+----------------------+------------------------------------------------+</tspan></text>
<text x="35" y="546"><tspan fill="#cbd5e1" font-weight="normal">| user:1001            | {&quot;name&quot;:&quot;Alex&quot;,&quot;role&quot;:&quot;staff_engineer&quot;...      |</tspan></text>
<text x="35" y="570"><tspan fill="#cbd5e1" font-weight="normal">| user:1002            | {&quot;name&quot;:&quot;Elena&quot;,&quot;role&quot;:&quot;architect&quot;...          |</tspan></text>
<text x="35" y="594"><tspan fill="#cbd5e1" font-weight="normal">| user:1003            | {&quot;name&quot;:&quot;Marcus&quot;,&quot;role&quot;:&quot;devops&quot;...            |</tspan></text>
<text x="35" y="618"><tspan fill="#475569" font-weight="normal">+----------------------+------------------------------------------------+</tspan></text>
<text x="35" y="642"><tspan fill="#22c55e" font-weight="normal">3 records found (took 0.45 ms)</tspan></text>
<text x="35" y="690"><tspan fill="#38bdf8" font-weight="bold">pebble&gt; </tspan><tspan fill="#f8fafc" font-weight="normal">stats</tspan></text>
<text x="35" y="714"><tspan fill="#fbbf24" font-weight="normal">LSM Stats: L0=2 files (8MB), L1=5 files (8MB), L2=12 files (24MB) | MemTable: 14KB</tspan></text>

</svg>